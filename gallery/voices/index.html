<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
  <button class="lightbox-close" type="button" aria-label="Close">&times;</button>
  <button class="lightbox-nav lightbox-prev" type="button" aria-label="Previous photo">&#8249;</button>
  <figure class="lightbox-figure">
    <img class="lightbox-img" alt="">
    <figcaption class="lightbox-caption">
      <span class="lightbox-text"></span>
      <span class="lightbox-side">
        
        <span class="lightbox-count"></span>
      </span>
    </figcaption>
  </figure>
  <button class="lightbox-nav lightbox-next" type="button" aria-label="Next photo">&#8250;</button>
</div>

<script>
(function () {
  var items = Array.prototype.slice.call(document.querySelectorAll('.art-item'));
  var box = document.getElementById('lightbox');
  if (!items.length || !box) return;

  var img = box.querySelector('.lightbox-img');
  var text = box.querySelector('.lightbox-text');
  var count = box.querySelector('.lightbox-count');
  var closeBtn = box.querySelector('.lightbox-close');
  var current = 0, opener = null, preload = [];

  function show(i) {
    current = (i + items.length) % items.length;
    var it = items[current];
    img.classList.add('loading');
    img.onload = function () { img.classList.remove('loading'); };
    img.src = it.dataset.full;
    img.alt = it.querySelector('img').alt;
    text.textContent = it.dataset.caption || '';
    count.textContent = (current + 1) + ' / ' + items.length;
    // Warm the cache for neighbours so arrowing feels instant.
    preload = [current + 1, current - 1].map(function (j) {
      var p = new Image();
      p.src = items[(j + items.length) % items.length].dataset.full;
      return p;
    });
  }

  function open(i) {
    opener = document.activeElement;
    box.hidden = false;
    document.body.classList.add('lightbox-open');
    show(i);
    closeBtn.focus();
  }

  function close() {
    box.hidden = true;
    document.body.classList.remove('lightbox-open');
    img.removeAttribute('src');
    if (opener) opener.focus();
  }

  items.forEach(function (it, i) {
    it.addEventListener('click', function () { open(i); });
  });
  closeBtn.addEventListener('click', close);
  box.querySelector('.lightbox-prev').addEventListener('click', function (e) { e.stopPropagation(); show(current - 1); });
  box.querySelector('.lightbox-next').addEventListener('click', function (e) { e.stopPropagation(); show(current + 1); });
  box.addEventListener('click', function (e) {
    if (e.target === box || e.target.classList.contains('lightbox-figure')) close();
  });

  document.addEventListener('keydown', function (e) {
    if (box.hidden) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowRight') show(current + 1);
    else if (e.key === 'ArrowLeft') show(current - 1);
  });

  // Swipe left/right on touch screens.
  var x0 = null;
  box.addEventListener('touchstart', function (e) { x0 = e.touches[0].clientX; }, { passive: true });
  box.addEventListener('touchend', function (e) {
    if (x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    if (Math.abs(dx) > 50) show(current + (dx < 0 ? 1 : -1));
    x0 = null;
  });
})();
</script>
